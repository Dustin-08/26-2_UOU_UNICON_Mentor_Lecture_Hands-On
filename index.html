<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 웹 위젯 랩 🧩</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Pretendard', -apple-system, 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #faf5ff 0%, #fdf2f8 100%);
            color: #1e293b;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 56px 20px 24px;
        }
        header h1 {
            margin: 0 0 10px;
            font-size: 2rem;
            color: #6d28d9;
        }
        header p {
            margin: 0;
            color: #64748b;
            line-height: 1.6;
        }
        .links {
            margin-top: 18px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .links a {
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 999px;
            background: #ffffff;
            color: #7c3aed;
            border: 1px solid #e9d5ff;
            transition: all 0.2s;
        }
        .links a:hover {
            background: #7c3aed;
            color: #fff;
        }
        .grid {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px 20px 60px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 22px;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid #f1f5f9;
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.07);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s, box-shadow 0.25s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 32px rgba(124, 58, 237, 0.14);
        }
        .preview {
            height: 220px;
            background: #f8fafc;
            border-bottom: 1px solid #f1f5f9;
        }
        .preview iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        .info {
            padding: 16px 18px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }
        .info h2 {
            margin: 0;
            font-size: 1.05rem;
        }
        .info p {
            margin: 0;
            font-size: 0.85rem;
            color: #64748b;
            line-height: 1.5;
            flex: 1;
        }
        .actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .actions a, .actions button {
            flex: 1;
            text-align: center;
            text-decoration: none;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 9px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .open-btn {
            background: #7c3aed;
            color: #fff;
            border: 1px solid #7c3aed;
        }
        .open-btn:hover { background: #6d28d9; }
        .copy-btn {
            background: #fff;
            color: #7c3aed;
            border: 1px solid #e9d5ff;
        }
        .copy-btn:hover { background: #faf5ff; }
        footer {
            text-align: center;
            padding: 0 20px 40px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <header>
        <h1>🧩 나만의 웹 위젯 랩</h1>
        <p>AI에게 말만 걸어서 만든 위젯 모음입니다.<br>
           <b>주소 복사</b>를 눌러 노션 페이지에 <code>/embed</code>로 붙여넣어 보세요!</p>
        <div class="links">
            <a href="https://github.com/Dustin-08/26-2_UOU_UNICON_Mentor_Lecture_Hands-On" target="_blank">📦 GitHub 저장소</a>
            <a href="https://github.com/Dustin-08/26-2_UOU_UNICON_Mentor_Lecture_Hands-On/blob/main/PROMPTS.md" target="_blank">🤖 AI 프롬프트 가이드</a>
        </div>
    </header>

    <main class="grid" id="grid"></main>

    <footer>Made with AI ✨ — 복사해서 자유롭게 수정해 쓰세요</footer>

    <script>
        const widgets = [
            { file: "timerWidget.html",  icon: "⏳", title: "D-Day 카운트다운", desc: "목표일까지 남은 일·시·분·초가 실시간으로 흘러가요." },
            { file: "interac_card.html", icon: "🚀", title: "기술 스택 3D 카드", desc: "마우스를 올리면 카드가 부드럽게 뒤집혀요." },
            { file: "myeongun.html",     icon: "💬", title: "오늘의 명언",       desc: "새로고침할 때마다 명언이 랜덤으로 바뀌어요." },
            { file: "progressbar.html",  icon: "⚡", title: "스킬 게이지",       desc: "로딩되면 게이지가 스르륵 차오르는 역량 바." },
            { file: "guest.html",        icon: "📝", title: "방명록 / 한줄 메모", desc: "한줄 메모를 남기고 지울 수 있어요. (내 브라우저에 저장)" },
            { file: "profile.html",      icon: "🔗", title: "소셜 링크",         desc: "GitHub·메일·LinkedIn·Instagram 버튼 모음." }
        ];

        const grid = document.getElementById("grid");

        widgets.forEach(w => {
            const url = new URL(w.file, location.href).href;
            const card = document.createElement("article");
            card.className = "card";
            card.innerHTML = `
                <div class="preview">
                    <iframe src="${w.file}" title="${w.title}" loading="lazy"></iframe>
                </div>
                <div class="info">
                    <h2>${w.icon} ${w.title}</h2>
                    <p>${w.desc}</p>
                    <div class="actions">
                        <a class="open-btn" href="${w.file}" target="_blank">열어보기</a>
                        <button class="copy-btn" type="button">주소 복사</button>
                    </div>
                </div>
            `;

            const btn = card.querySelector(".copy-btn");
            btn.addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(url);
                    btn.textContent = "✅ 복사됨!";
                } catch (e) {
                    prompt("아래 주소를 복사하세요", url);
                }
                setTimeout(() => (btn.textContent = "주소 복사"), 1500);
            });

            grid.appendChild(card);
        });
    </script>
</body>
</html>
