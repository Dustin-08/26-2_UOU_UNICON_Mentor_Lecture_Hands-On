<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 웹 위젯 랩 🧩</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            font-family: 'Pretendard', -apple-system, 'Noto Sans KR', sans-serif;
            /* 스크롤 부드러움을 위해 fixed 제거 및 최적화된 오버레이 적용 */
            background: linear-gradient(rgba(15, 23, 42, 0.3), rgba(15, 23, 42, 0.3)), 
                        url('bg_26101.png') no-repeat center center;
            background-size: cover;
            color: #f8fafc;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 56px 20px 24px;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 2.2rem;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        header p {
            margin: 0;
            color: #e2e8f0;
            line-height: 1.6;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        /* 상단 링크 버튼 리퀴드 글래스 스타일 */
        .links {
            margin-top: 18px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .links a {
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 9px 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.25s ease;
        }
        .links a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .grid {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px 20px 60px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 22px;
        }

        /* 🌟 최적화 및 리퀴드 글래스 스타일 적용된 카드 */
        .card {
            background: rgba(255, 255, 255, 0.15); 
            /* 버벅임 방지를 위해 블러 수치를 16px로 최적화 */
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            
            border-radius: 26px;
            border: 1.5px solid rgba(255, 255, 255, 0.65);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.2),
                inset 0 1.5px 3px rgba(255, 255, 255, 0.9);
                
            overflow: hidden;
            display: flex;
            flex-direction: column;
            
            /* 스크롤 하드웨어 가속 힌트 부여 (버벅임 방지) */
            will-change: transform;
            transform: translateZ(0);
            
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                        background 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.3),
                inset 0 2px 4px rgba(255, 255, 255, 1);
        }

        .preview {
            height: 220px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .preview iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .info {
            padding: 16px 18px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .info h2 {
            margin: 0;
            font-size: 1.05rem;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .info p {
            margin: 0;
            font-size: 0.85rem;
            color: #e2e8f0;
            line-height: 1.5;
            flex: 1;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .actions a, .actions button {
            flex: 1;
            text-align: center;
            text-decoration: none;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 10px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .open-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }
        .open-btn:hover { 
            background: linear-gradient(135deg, #6d28d9 0%, #5b21b6 100%); 
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .copy-btn:hover { 
            background: rgba(255, 255, 255, 0.4); 
        }

        footer {
            text-align: center;
            padding: 20px 20px 50px;
            font-size: 0.8rem;
            color: #cbd5e1;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>🧩 나만의 웹 위젯 랩</h1>
        <p>AI에게 말만 걸어서 만든 위젯 모음입니다.<br>
           <b>주소 복사</b>를 눌러 노션 페이지에 <code>/embed</code>로 붙여넣어 보세요!</p>
        <div class="links">
            <a href="https://github.com/Dustin-08/26-2_UOU_UNICON_Mentor_Lecture_Hands-On" target="_blank">📦 GitHub 저장소</a>
            <a href="https://github.com/Dustin-08/26-2_UOU_UNICON_Mentor_Lecture_Hands-On/blob/main/PROMPTS.md" target="_blank">🤖 AI 프롬프트 가이드</a>
        </div>
    </header>
    
    <main class="grid" id="grid"></main>

    <footer>Made with AI ✨ — 복사해서 자유롭게 수정해 쓰세요</footer>

    <script>
        const widgets = [
            { file: "timerWidget.html",  icon: "⏳", title: "D-Day 카운트다운", desc: "목표일까지 남은 일·시·분·초가 실시간으로 흘러가요." },
            { file: "interac_card.html", icon: "🚀", title: "기술 스택 3D 카드", desc: "마우스를 올리면 카드가 부드럽게 뒤집혀요." },
            { file: "myeongun.html",     icon: "💬", title: "오늘의 명언",       desc: "새로고침할 때마다 명언이 랜덤으로 바뀌어요." },
            { file: "progressbar.html",  icon: "⚡", title: "스킬 게이지",       desc: "로딩되면 게이지가 스르륵 차오르는 역량 바." },
            { file: "guest.html",        icon: "📝", title: "방명록 / 한줄 메모", desc: "한줄 메모를 남기고 지울 수 있어요. (내 브라우저에 저장)" },
            { file: "profile.html",      icon: "🔗", title: "소셜 링크",         desc: "GitHub·메일·LinkedIn·Instagram 버튼 모음." },
            { file: "timeline.html",       icon: "🛤", title: "성장 타임라인",         desc: "이력과 마일스톤을 시간순으로 아카이빙해요." },
            { file: "pomodoro.html",       icon: "🍅", title: "포모도로 타이머",       desc: "25분 집중, 5분 휴식 타이머예요." }
        ];

        const grid = document.getElementById("grid");

        widgets.forEach(w => {
            const url = new URL(w.file, location.href).href;
            const card = document.createElement("article");
            card.className = "card";
            card.innerHTML = `
                <div class="preview">
                    <iframe src="${w.file}" title="${w.title}" loading="lazy"></iframe>
                </div>
                <div class="info">
                    <h2>${w.icon} ${w.title}</h2>
                    <p>${w.desc}</p>
                    <div class="actions">
                        <a class="open-btn" href="${w.file}" target="_blank">열어보기</a>
                        <button class="copy-btn" type="button">주소 복사</button>
                    </div>
                </div>
            `;

            const btn = card.querySelector(".copy-btn");
            btn.addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(url);
                    btn.textContent = "✅ 복사됨!";
                } catch (e) {
                    prompt("아래 주소를 복사하세요", url);
                }
                setTimeout(() => (btn.textContent = "주소 복사"), 1500);
            });

            grid.appendChild(card);
        });
    </script>
</body>
</html>
