<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>기술 스택 카드</title>
    <style>
        body {
            background: #faf5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Pretendard', sans-serif;
        }
        .skill-card {
            background-color: transparent;
            width: 200px;
            height: 120px;
            perspective: 1000px;
            cursor: pointer;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.1);
            border-radius: 16px;
        }
        .skill-card:hover .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            border: 1px solid #e9d5ff;
        }
        .card-front {
            background-color: #ffffff;
            color: #6d28d9;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .card-back {
            background-color: #7c3aed;
            color: white;
            transform: rotateY(180deg);
            font-size: 0.9rem;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="skill-card">
        <div class="card-inner">
            <div class="card-front">
                🚀 React Native
            </div>
            <div class="card-back">
                크로스 플랫폼 앱 개발 마스터하기!
            </div>
        </div>
    </div>

</body>
</html>
