<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>D-Day 위젯</title>
    <style>
        body {
            background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Pretendard', sans-serif;
        }
        .dday-card {
            background: rgba(255, 255, 255, 0.8);
            padding: 30px 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.1);
            text-align: center;
            border: 1px solid rgba(221, 214, 254, 0.5);
        }
        h2 {
            margin: 0 0 10px 0;
            color: #6d28d9;
            font-size: 1.2rem;
        }
        #countdown {
            font-size: 2rem;
            font-weight: 700;
            color: #4c1d95;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="dday-card">
        <h2 id="title">✨ 멋진 개발자 되기까지</h2>
        <p id="countdown">계산 중...</p>
    </div>

    <script>
        // 목표 날짜 설정 (년, 월-1, 일) -> 월은 0부터 시작하므로 11월이면 10으로 입력
        const targetDate = new Date(2026, 11, 31, 23, 59, 59);

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;

            if (diff <= 0) {
                document.getElementById("countdown").innerText = "🎉 목표 달성 완료!";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("countdown").innerText = 
                `${days}일 ${hours}시간 ${minutes}분 ${seconds}초`;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
